routines:
  inspect:
    steps:
      - type: service
        service_name: /go_to_frame
        service_type: iros_custom_msgs/srv/GoToFrame
        request: { frame: pose_up }
        delay_after_sec: 0.5

      - type: service
        service_name: /iros_cv_session_hub/run_rust
        service_type: std_srvs/srv/Trigger
        request: {}
        service_timeout_sec: 20.0
        delay_after_sec: 0.5

      - type: service
        service_name: /go_to_frame
        service_type: iros_custom_msgs/srv/GoToFrame
        request: { frame: poi_pcb }
        delay_after_sec: 0.5

      - type: service
        service_name: /iros_cv_session_hub/run_pcb
        service_type: std_srvs/srv/Trigger
        request: {}
        service_timeout_sec: 20.0
        delay_after_sec: 0.5

      - type: service
        service_name: /go_to_frame
        service_type: iros_custom_msgs/srv/GoToFrame
        request: { frame: poi_gear_common }
        delay_after_sec: 0.5

      - type: service
        service_name: /iros_cv_session_hub/run_gear
        service_type: std_srvs/srv/Trigger
        request: {}
        service_timeout_sec: 20.0
        delay_after_sec: 0.5

      - type: service
        service_name: /iros_cv_session_hub/publish
        service_type: std_srvs/srv/Trigger
        request: {}
        service_timeout_sec: 20.0
        delay_after_sec: 0.5

      - type: wait_topic
        topic_name: /cv_hub/result/summary
        topic_type: std_msgs/msg/Bool
        store_as: cv_ok
        timeout_sec: 15.0
        delay_after_sec: 0.5

      - type: service
        service_name: /gripper_action
        service_type: iros_custom_msgs/srv/GripperAction
        request: { open: true }
        delay_after_sec: 0.5

      - type: service
        service_name: /go_to_frame
        service_type: iros_custom_msgs/srv/GoToFrame
        request: { frame: pose_pick_up }
        delay_after_sec: 0.5

      - type: service
        service_name: /go_to_frame
        service_type: iros_custom_msgs/srv/GoToFrame
        request: { frame: pose_pick }
        delay_after_sec: 0.5

      - type: service
        service_name: /gripper_action
        service_type: iros_custom_msgs/srv/GripperAction
        request: { open: false }

      - type: sleep
        duration_sec: 0.5

      - type: service
        service_name: /go_to_frame
        service_type: iros_custom_msgs/srv/GoToFrame
        request: { frame: pose_pick_up }
        delay_after_sec: 0.5

      - type: branch
        var: cv_ok
        cases:
          true:
            - type: service
              service_name: /go_to_frame
              service_type: iros_custom_msgs/srv/GoToFrame
              request: { frame: pose_drop_ok_up }
            - type: service
              service_name: /go_to_frame
              service_type: iros_custom_msgs/srv/GoToFrame
              request: { frame: pose_drop_ok }
            - type: service
              service_name: /gripper_action
              service_type: iros_custom_msgs/srv/GripperAction
              request: { open: true }
            - type: sleep
              duration_sec: 0.5
            - type: service
              service_name: /go_to_frame
              service_type: iros_custom_msgs/srv/GoToFrame
              request: { frame: pose_drop_ok_up }

          false:
            - type: service
              service_name: /go_to_frame
              service_type: iros_custom_msgs/srv/GoToFrame
              request: { frame: pose_drop_nok_up }
            - type: service
              service_name: /go_to_frame
              service_type: iros_custom_msgs/srv/GoToFrame
              request: { frame: pose_drop_nok }
            - type: service
              service_name: /gripper_action
              service_type: iros_custom_msgs/srv/GripperAction
              request: { open: true }
            - type: sleep
              duration_sec: 0.5
            - type: service
              service_name: /go_to_frame
              service_type: iros_custom_msgs/srv/GoToFrame
              request: { frame: pose_drop_nok_up }

  calibration:
    steps:
      - type: service
        service_name: /go_to_frame
        service_type: iros_custom_msgs/srv/GoToFrame
        request: { frame: poi_pcb }

      - type: service
        service_name: /pcb_inspector/calibration
        service_type: std_srvs/srv/Trigger
        request: {}
        service_timeout_sec: 20.0

  reset:
    steps:
      - type: service
        service_name: /pcb_inspector/reset
        service_type: std_srvs/srv/Trigger
        request: {}
        service_timeout_sec: 20.0
