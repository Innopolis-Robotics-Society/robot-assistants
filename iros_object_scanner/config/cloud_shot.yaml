cloud_shot:
  ros__parameters:
    input_cloud_topic: "/points2"
    target_frame: "base"
    output_cloud_topic: "/scanner/object_cloud"

    publish_debug: true
    max_cloud_age_ms: 5000
    tf_timeout_ms: 200

    # ROI в frame=base (подстрой под твою сцену)
    roi_x_min:  -0.50
    roi_x_max:  0.00
    roi_y_min:  -1.00
    roi_y_max:  1.00
    roi_z_min:  -1.00
    roi_z_max:  1.00

    use_voxel: true
    voxel_leaf_m: 0.002

    async_capture: true

    ransac_dist_thresh: 0.005
    ransac_max_iter: 1000
    table_margin_z: 0.005
    min_plane_inliers: 5000

    cluster_tolerance: 0.010
    min_cluster_size: 800
    max_cluster_size: 500000

    outlier_method: "sor"   # sor|radius|none
    sor_mean_k: 50
    sor_stddev_mul: 1.0

    radius_outlier_r: 0.005
    radius_outlier_min_neighbors: 5
